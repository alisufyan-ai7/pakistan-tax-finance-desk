<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner MFA Login · Synthetic Finance Desk</title>
<style>:root{font-family:system-ui,sans-serif;background:#f4f7fb;color:#18294b}body{margin:8vh auto;max-width:430px;padding:20px}main{padding:28px;background:white;border:1px solid #d8e2f0;border-radius:18px}h1{font-size:22px}p{font-size:13px;line-height:1.5;color:#586b86}label{display:block;margin:16px 0;font-size:14px}input{margin-top:6px;display:block;width:100%;padding:12px;border:1px solid #cbd4e5;border-radius:9px;box-sizing:border-box;font-size:16px}button{background:#234fa1;border:0;border-radius:9px;color:white;padding:12px 18px;width:100%;font-weight:650}#msg{color:#a63c2f}</style></head>
<body><main><h1>Owner two-factor login</h1><p>Development session only. Genuine financial data must not be uploaded. Requires HTTPS and a previously configured synthetic owner secret.</p>
<form id="form"><label>Username<input name="username" autocomplete="username" value="owner" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><label>Authenticator code<input name="totp_code" autocomplete="one-time-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></label><button type="submit">Sign in</button></form><p role="alert" id="msg"></p></main>
<script>document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();let form=new FormData(e.target);try{let response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(Object.fromEntries(form.entries()))});if(!response.ok)throw Error('Unable to sign in; check configuration and one-time code');location.replace('/')}catch(err){document.getElementById('msg').textContent=err.message}})</script></body></html>
