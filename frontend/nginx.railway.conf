server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; manifest-src 'self'; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # The sole public synthetic API route. The complete financial API,
    # uploaded documents and PostgreSQL are NEVER publicly proxied.
    location = /api/preview/status {
        limit_except GET { deny all; }
        proxy_http_version 1.1;
        proxy_pass http://personal-cfo-api-preview.railway.internal:8000/internal/preview/status;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Personal-CFO-Preview-Key "${PREVIEW_INTERNAL_TOKEN}";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 7s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location = / {
        try_files /index.html =404;
    }

    # PWA is a synthetic-only installable shell. No worker caches API data.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location = /sw.js {
        types { application/javascript js; }
        try_files $uri =404;
    }

    location ~* \.png$ {
        types { image/png png; }
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location ~* \.css$ {
        types { text/css css; }
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
