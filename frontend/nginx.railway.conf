    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Owner-approved single application: the root is a navigation entry only.
    # No public financial demo, no separate installed preview identity.
    # Temporary no-cache redirect avoids permanently caching auth navigation
    # and never reveals whether the owner has a valid private session.
    location = / {
        if ($request_method != "GET") { return 405; }
        if ($args != "") { return 400; }
        return 302 /app;
    }

    # The historical fictional root site remains in source for offline tests,
    # but these URLs cannot be opened on the owner-facing Railway domain.
    location = /index.html {
        return 404;
    }

    # No public-preview PWA identity: only the owner manifest can be served.
    location = /manifest.webmanifest {
        return 404;
    }

    # Existing no-fetch worker never caches private data.
    location = /owner-manifest.webmanifest {
        access_log off;
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "GET") { return 405; }
        types { application/manifest+json webmanifest; }
        try_files /owner-manifest.webmanifest =404;
    }

    location = /sw.js {
        types { application/javascript js; }
        try_files $uri =404;
    }

    location ~* \.png$ {
        types { image/png png; }
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location ~* \.css$ {
        types { text/css css; }
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
