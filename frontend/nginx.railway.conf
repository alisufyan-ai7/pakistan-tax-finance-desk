server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location = / {
        try_files /index.html =404;
    }

    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location ~* \.css$ {
        types { text/css css; }
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
