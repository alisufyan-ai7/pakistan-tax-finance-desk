server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; manifest-src 'self'; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # The sole public synthetic API route. The complete financial API,
    # uploaded documents and PostgreSQL are NEVER publicly proxied.
    location = /api/preview/status {
        limit_except GET { deny all; }
        proxy_http_version 1.1;
        # Railway reassigns private service IPs after each deployment.
        # A literal proxy_pass hostname is resolved ONCE at Nginx startup and
        # can strand the public preview on a dead backend address (502/504).
        # Runtime variable lookup with the project-scoped Railway DNS server
        # refreshes the address; do not route this through a public domain.
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_preview_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_preview_upstream/internal/preview/status$is_args$args;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Personal-CFO-Preview-Key "${PREVIEW_INTERNAL_TOKEN}";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 7s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }


    # This flag and distinct gateway key are absent on the currently approved
    # frontend. Exact protected routes below return 404 unless an operator
    # separately completes live G2 ingress/log/runtime review and enables them.
    set $p1ak_owner_ingress "${P1AK_OWNER_INGRESS_ENABLED}";
    set $p1ak_gateway_token "${P1Q_PRIVATE_GATEWAY_SHARED_TOKEN}";
    set $p1ao_google_ingress "${P1AO_GOOGLE_INGRESS_ENABLED}";
    limit_req_status 429;

    # Never serve the owner credential form from its file URL. Only the
    # reviewed /owner-login route can reveal it after ingress activation.
    location = /owner-login.html {
        return 404;
    }

    location = /owner-login {
        access_log off;
        error_log /dev/null crit;
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "GET") { return 405; }
        try_files /owner-login.html =404;
    }

    # Reviewed exact owner-only route. Never a wildcard /api/ proxy.
    location = /api/owner/login {
        access_log off;
        error_log /dev/null crit;
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($p1ak_gateway_token = "") { return 503; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "POST") { return 405; }
        if ($args != "") { return 400; }
    limit_req zone=cfo_owner_ip burst=3 nodelay;
    limit_req zone=cfo_owner_global burst=12 nodelay;
        client_max_body_size 4k;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_auth_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_auth_upstream/internal/drive/auth/login;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Personal-CFO-Preview-Key "";
        proxy_set_header X-Personal-CFO-Private-Gateway $p1ak_gateway_token;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Reviewed exact owner-only route. Never a wildcard /api/ proxy.
    location = /api/owner/session {
        access_log off;
        error_log /dev/null crit;
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($p1ak_gateway_token = "") { return 503; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "GET") { return 405; }
        if ($args != "") { return 400; }
    limit_req zone=cfo_owner_global burst=12 nodelay;
        client_max_body_size 4k;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_auth_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_auth_upstream/internal/drive/auth/session;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Personal-CFO-Preview-Key "";
        proxy_set_header X-Personal-CFO-Private-Gateway $p1ak_gateway_token;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Reviewed exact owner-only route. Never a wildcard /api/ proxy.
    location = /api/owner/logout {
        access_log off;
        error_log /dev/null crit;
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($p1ak_gateway_token = "") { return 503; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "POST") { return 405; }
        if ($args != "") { return 400; }
    limit_req zone=cfo_owner_global burst=12 nodelay;
        client_max_body_size 4k;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_auth_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_auth_upstream/internal/drive/auth/logout;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Personal-CFO-Preview-Key "";
        proxy_set_header X-Personal-CFO-Private-Gateway $p1ak_gateway_token;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }


    # P1AO restricted metadata-only OAuth. Public URLs return 404 unless
    # independently approved G2 owner login and OAuth ingress gates are ON.

    location = /api/drive/oauth/start {
        access_log off;
        error_log /dev/null crit;
        if ($p1ao_google_ingress != "1") { return 404; }
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($p1ak_gateway_token = "") { return 503; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "POST") { return 405; }
        if ($args != "") { return 400; }
        client_max_body_size 1k;
        limit_req zone=cfo_owner_global burst=12 nodelay;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_google_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_google_upstream/internal/drive/oauth/start;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Personal-CFO-Preview-Key "";
        proxy_set_header X-Personal-CFO-Private-Gateway $p1ak_gateway_token;
        proxy_connect_timeout 3s;
        proxy_read_timeout 9s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # On-demand metadata only; opaque pagination is in POST JSON, not URL.
    location = /api/drive/metadata/page {
        access_log off;
        error_log /dev/null crit;
        if ($p1ao_google_ingress != "1") { return 404; }
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($p1ak_gateway_token = "") { return 503; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "POST") { return 405; }
        if ($args != "") { return 400; }
        client_max_body_size 2k;
        limit_req zone=cfo_owner_global burst=12 nodelay;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_google_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_google_upstream/internal/drive/metadata/page;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Personal-CFO-Preview-Key "";
        proxy_set_header X-Personal-CFO-Private-Gateway $p1ak_gateway_token;
        proxy_connect_timeout 3s;
        proxy_read_timeout 9s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /api/drive/oauth/callback {
        access_log off;
        error_log /dev/null crit;
        if ($p1ao_google_ingress != "1") { return 404; }
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($p1ak_gateway_token = "") { return 503; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "GET") { return 405; }
        # Provider GET includes code/state; backend validates exactly once.
        # Never log full request target at Nginx or upstream.
        client_max_body_size 1k;
        limit_req zone=cfo_owner_global burst=12 nodelay;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_google_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_google_upstream/internal/drive/oauth/callback$is_args$args;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Personal-CFO-Preview-Key "";
        proxy_set_header X-Personal-CFO-Private-Gateway $p1ak_gateway_token;
        proxy_connect_timeout 3s;
        proxy_read_timeout 9s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /api/drive/oauth/status {
        access_log off;
        error_log /dev/null crit;
        if ($p1ao_google_ingress != "1") { return 404; }
        if ($p1ak_owner_ingress != "1") { return 404; }
        if ($p1ak_gateway_token = "") { return 503; }
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "GET") { return 405; }
        if ($args != "") { return 400; }
        client_max_body_size 1k;
        limit_req zone=cfo_owner_global burst=12 nodelay;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_google_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_google_upstream/internal/drive/oauth/status;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Personal-CFO-Preview-Key "";
        proxy_set_header X-Personal-CFO-Private-Gateway $p1ak_gateway_token;
        proxy_connect_timeout 3s;
        proxy_read_timeout 9s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location = / {
        try_files /index.html =404;
    }

    # PWA is a synthetic-only installable shell. No worker caches API data.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location = /sw.js {
        types { application/javascript js; }
        try_files $uri =404;
    }

    location ~* \.png$ {
        types { image/png png; }
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location ~* \.css$ {
        types { text/css css; }
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
