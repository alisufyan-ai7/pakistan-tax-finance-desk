# Runs inside the nginx http{} scope through conf.d. Never uses user data.
# Two limits: independent per-edge-IP throttling and a bounded global ceiling.
# Platform-level abusive traffic and raw request-target logs need acceptance.
limit_req_zone $binary_remote_addr zone=cfo_owner_ip:10m rate=8r/m;
limit_req_zone $server_name zone=cfo_owner_global:1m rate=120r/m;
