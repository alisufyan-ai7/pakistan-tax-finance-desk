name: backend-ci
# Optimize expensive PostgreSQL integration checks: one exact-head PR run,
# cancel superseded PR heads, and permit explicit manual verification.
# No redundant main-branch push rerun after a tested squash merge.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_not_a_real_secret
          POSTGRES_DB: synthetic_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic_ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install synthetic-only Python application and PostgreSQL test driver
        run: python -m pip install -e '.[dev,postgres]'
      - name: Run synthetic-only regression tests
        run: pytest -q
      - name: Verify PostgreSQL 18 migrations without real financial records
        env:
          DATABASE_URL: postgresql+psycopg://postgres:synthetic_ci_not_a_real_secret@localhost:5432/synthetic_ci_db
          APP_DATA_MODE: synthetic
          # Public fake CI key; synthetic test data only.
          LEDGER_FIELD_KEYS_JSON: '{"synthetic_ci":"U1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1M="}'
          LEDGER_FIELD_ACTIVE_KEY: synthetic_ci
          PRIVATE_EVENT_HMAC_KEY: 'UFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFA='
          LEDGER_DEDUP_HMAC_KEY: 'REREREREREREREREREREREREREREREREREREREREREM='
          CANONICAL_JOURNAL_HMAC_KEY: 'SkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSko='
          OWNER_RECOVERY_HMAC_KEY: 'UVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVE='
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          import os
          engine=create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as c:
              assert c.execute(text('SELECT version_num FROM alembic_version')).scalar_one() == '0023_drive_revision'
              assert {'accounts','documents','transactions','audit_events','historical_filings'} <= set(inspect(c).get_table_names())
          # Test the operational encrypted bank-source path against real ephemeral PG18,
          # not just DDL. All identifiers and figures are fabricated.
          import base64
          os.environ['CONFIDENTIAL_BANK_HMAC_KEY']=base64.urlsafe_b64encode(b'C'*32).decode()
          os.environ['OWNER_PASSWORD']='synthetic-ci-owner-password-123456'
          from fastapi.testclient import TestClient
          from app.main import create_app
          app=create_app()
          assert app.title.startswith('Pakistan Tax')
          synthetic={
              'synthetic_fixture':True,'legal_owner':'individual','currency':'PKR',
              'account_ref':'SYNTHETIC-POSTGRES-ACCOUNT-1',
              'institution':'SYNTHETIC-BANK-ONLY',
              'source_ref':'SYNTHETIC-POSTGRES-STMT-0001',
              'period_start':'2024-07-01','period_end':'2024-07-31',
              'opening_balance_minor':12345,'closing_balance_minor':12545,
              'rows':[{'row_number':2,'posted_on':'2024-07-15','description':'synthetic only',
                       'reference':'SYN-PG1','credit_minor':200,'debit_minor':0,'balance_minor':12545}],
          }
          with TestClient(app) as client:
              client.auth=('owner',os.environ['OWNER_PASSWORD'])
              created=client.post('/api/finance/confidential-bank/statements',json=synthetic)
              assert created.status_code==201, created.text
              replay=client.post('/api/finance/confidential-bank/statements',json=synthetic)
              assert replay.status_code==200 and replay.json()['already_recorded']
              found=client.get('/api/finance/confidential-bank/statements',
                               params={'account_ref':synthetic['account_ref'],'tax_year':2025})
              assert found.status_code==200 and found.json()['source_count']==1
              assert client.get('/api/summary?tax_year=2025').json()['record_count']==0
          with engine.connect() as db:
              raw=db.execute(text('SELECT payload_json FROM confidential_bank_batches')).scalar_one()
              assert raw.startswith('TFLE1:')
              assert all(secret not in raw for secret in ('12345','12545','2024-07-15',
                                                         'SYNTHETIC-POSTGRES-ACCOUNT-1','synthetic only'))

          # A6: proof that the NEW independently keyed synthetic canonical
          # journal can WRITE, IDEMPOTENTLY REPLAY and READ its own AES-GCM
          # entries in PostgreSQL18; legacy summary remains untouched.
          from app.canonical_journal import JournalEvent,record_synthetic_journal,inspect_synthetic_journal
          from sqlalchemy.orm import Session
          posting = JournalEvent.model_validate({
              'synthetic_fixture':True,
              'legal_owner':'individual',
              'currency':'PKR',
              'source_ref':'SYNTHETIC-POSTGRES-CANONICAL-ROW-1',
              'primary_account_ref':'SYNTHETIC-POSTGRES-ACCOUNT-1',
              'posted_on':'2024-07-15',
              'event_kind':'bank_receipt',
              'legs':[
                  {'account_ref':'SYNTHETIC-POSTGRES-ACCOUNT-1','account_kind':'bank','signed_minor':777},
                  {'account_ref':'SYNTHETIC-INCOME-SOURCE','account_kind':'income','signed_minor':-777},
              ],
          })
          with Session(engine) as db:
              receipt,already=record_synthetic_journal(db,posting)
              assert receipt['balanced_to_zero'] and not already
              repeat,already=record_synthetic_journal(db,posting)
              assert already and repeat['id']==receipt['id']
              account_receipt=inspect_synthetic_journal(db,
                  primary_account_ref='SYNTHETIC-POSTGRES-ACCOUNT-1',tax_year=2025)
              assert account_receipt['source_event_count']==1
              assert account_receipt['account_balance_minor'] is None
          with engine.connect() as db:
              cipher=db.execute(text('SELECT payload_json FROM canonical_journal_entries')).scalar_one()
              assert cipher.startswith('TFLE1:')
              for sensitive in ('777','2024-07-15','SYNTHETIC-POSTGRES-CANONICAL-ROW-1'):
                  assert sensitive not in cipher
          print('POSTGRES_18_CANONICAL_JOURNAL_ACTIVE_SYNTHETIC=PASS')

          # G2: actual ephemeral PostgreSQL18 atomic code consumption,
          # persisted AES-GCM recovery bundle and chained audit verification.
          from app.persisted_owner_recovery import (
              issue_persisted_synthetic_codes, consume_persisted_synthetic_code,
              attest_synthetic_recovery_chain,
          )
          from app.owner_recovery_codes import RecoveryBlocked
          with Session(engine) as db:
              recovered,one_time=issue_persisted_synthetic_codes(
                  db,owner_ref='owner',mfa_confirmed=True,issued_epoch=1760000000)
              assert recovered['persisted_atomically']
              consumed=consume_persisted_synthetic_code(
                  db,owner_ref='owner',presented_code=one_time[0],
                  password_confirmed=True,now_epoch=1760000001)
              assert consumed['consumed_once_in_transaction']
              try:
                  consume_persisted_synthetic_code(
                      db,owner_ref='owner',presented_code=one_time[0],
                      password_confirmed=True,now_epoch=1760000002)
                  raise AssertionError('Already consumed code was reused')
              except RecoveryBlocked:
                  pass
              integrity=attest_synthetic_recovery_chain(db,owner_ref='owner')
              assert integrity['audit_chain_verified']
              assert integrity['audit_revision']==2
          with engine.connect() as db:
              row=db.execute(text('SELECT bundle_json FROM owner_recovery_states')).scalar_one()
              assert row.startswith('TFLE1:')
              assert all(raw.replace('-','') not in row for raw in one_time)
              assert db.execute(text('SELECT COUNT(*) FROM owner_recovery_audit')).scalar_one()==2
          print('POSTGRES_18_G2_ATOMIC_RECOVERY_AUDIT=PASS')

          # Real ephemeral PG18 two-connection race, not just mocked SQL.
          from concurrent.futures import ThreadPoolExecutor
          from threading import Barrier
          with Session(engine) as db:
              _,challenge_codes=issue_persisted_synthetic_codes(
                  db, owner_ref='owner-race',mfa_confirmed=True,issued_epoch=1760000100)
          together=Barrier(2)
          def compete_for_same_code():
              together.wait(timeout=5)
              with Session(engine) as scoped:
                  try:
                      return bool(consume_persisted_synthetic_code(
                          scoped,owner_ref='owner-race',presented_code=challenge_codes[0],
                          password_confirmed=True,now_epoch=1760000101
                      )['consumed_once_in_transaction'])
                  except RecoveryBlocked:
                      return False
          with ThreadPoolExecutor(max_workers=2) as concurrent:
              a=concurrent.submit(compete_for_same_code)
              b=concurrent.submit(compete_for_same_code)
              assert sorted([a.result(timeout=15),b.result(timeout=15)]) == [False,True]
          with Session(engine) as db:
              final_state=attest_synthetic_recovery_chain(db,owner_ref='owner-race')
              assert final_state['audit_revision']==2 and final_state['active_code_count']==7
          print('POSTGRES_18_G2_TWO_WORKER_ONE_TIME_CODE_RACE=PASS')

          # P1: genuine PostgreSQL18 persistence for synthetic fake Drive
          # metadata only; never connect OAuth or import original bytes.
          from app.drive_inbox_planner import DriveFile, _index as drive_index
          from app.drive_inbox_store import (
              apply_synthetic_drive_snapshot, read_synthetic_drive_review_queue,
          )
          only_fake_folder='SYNTHETIC-CFO-ONLY-INBOX-2026'
          os.environ['DRIVE_INDEX_HMAC_KEY']=base64.urlsafe_b64encode(b'D'*32).decode()
          os.environ['DRIVE_FAKE_TRANSPORT_ONLY']='1'
          os.environ['DRIVE_ALLOWED_FOLDER_HMAC']=drive_index('folder',only_fake_folder)
          def fake_drive_item(ordinal, date_modified='2026-11-17T12:00:00+05:00'):
              return DriveFile.model_validate({
                  'id':f'SYNTHETIC-DRIVE-FILE-{ordinal:05d}',
                  'name':'Fictional bank statement.pdf' if ordinal==1 else 'IRIS draft.pdf',
                  'mime_type':'application/pdf','parent_ids':[only_fake_folder],
                  'size_bytes':2211,'modified_time':date_modified,
              })
          with Session(engine) as db:
              report=apply_synthetic_drive_snapshot(
                  db,folder_id=only_fake_folder,
                  files=(fake_drive_item(1),fake_drive_item(2)),
                  snapshot_complete=True,approved_synthetic_fixture=True)
              assert report['scan_number']==1 and report['visible_sources']==2
              repeat=apply_synthetic_drive_snapshot(
                  db,folder_id=only_fake_folder,
                  files=(fake_drive_item(1),fake_drive_item(2)),
                  snapshot_complete=True,approved_synthetic_fixture=True)
              assert repeat['idempotent_replay'] and repeat['scan_number']==1
              changed=apply_synthetic_drive_snapshot(
                  db,folder_id=only_fake_folder,
                  files=(fake_drive_item(1,'2026-11-17T12:30:00+05:00'),),
                  snapshot_complete=True,approved_synthetic_fixture=True)
              assert changed['scan_number']==2 and changed['unavailable_sources_need_review']==1
              queue=read_synthetic_drive_review_queue(db,folder_id=only_fake_folder)
              assert queue['integrity_checked'] and len(queue['queue'])==2
          with engine.connect() as c:
              ciphertext=c.execute(text(
                  'SELECT payload_json FROM drive_inbox_items')).scalars().all()
              assert len(ciphertext)==2 and all(x.startswith('TFLE1:') for x in ciphertext)
              assert all('Fictional bank' not in x for x in ciphertext)
              assert c.execute(text(
                  'SELECT COUNT(*) FROM drive_inbox_checkpoints')).scalar_one()==1
          print('POSTGRES_18_P1_DRIVE_ATOMIC_ENCRYPTED_INBOX=PASS')

          # P1E cloud custody: actual transient PG18 cross-worker concurrency.
          # All Google identity, folder, verifier and grants below are fictional.
          from app.drive_google_oauth import (
              PERSONAL_CFO_RAILWAY_CALLBACK, private_google_configuration,
              begin_google_metadata_consent,
          )
          from app.cloud_drive_oauth_vault import (
              remember_fake_cloud_attempt, claim_fake_cloud_attempt,
              seal_fake_cloud_grant, read_fake_cloud_grant, CloudOAuthCustodyBlocked,
          )
          from sqlalchemy import inspect
          assert {'drive_cloud_oauth_attempts','drive_cloud_oauth_grants'} <= set(inspect(engine).get_table_names())
          fake_cloud_folder='SYNTHETIC_P1E_PG_ONLY_CLOUD_FOLDER_2026'
          os.environ['P1B_PRIVATE_OAUTH_CONTRACT_ONLY']='1'
          os.environ['P1D_RAILWAY_CALLBACK_CONTRACT_ONLY']='1'
          os.environ['P1E_SYNTHETIC_CLOUD_CUSTODY_ONLY']='1'
          os.environ['P1B_GOOGLE_CLIENT_ID']='000000000000-syntheticdev.apps.googleusercontent.com'
          os.environ['P1B_GOOGLE_REDIRECT_URI']=PERSONAL_CFO_RAILWAY_CALLBACK
          os.environ['P1B_GOOGLE_FOLDER_ID']=fake_cloud_folder
          os.environ['DRIVE_ALLOWED_FOLDER_HMAC']=drive_index('folder',fake_cloud_folder)
          os.environ['P1E_FAKE_CLOUD_VAULT_KEY']=base64.urlsafe_b64encode(b'E'*32).decode()
          os.environ['P1E_FAKE_CLOUD_INDEX_KEY']=base64.urlsafe_b64encode(b'J'*32).decode()
          challenge=begin_google_metadata_consent(private_google_configuration())
          with Session(engine) as db:
              assert remember_fake_cloud_attempt(db,pending=challenge,now_epoch=1800000000)['fake_attempt_sealed']
          race=Barrier(2)
          def race_google_state():
              race.wait(timeout=10)
              with Session(engine) as scoped:
                  try:
                      return claim_fake_cloud_attempt(scoped,state=challenge.state,now_epoch=1800000001).pkce_verifier == challenge.pkce_verifier
                  except CloudOAuthCustodyBlocked:
                      return False
          with ThreadPoolExecutor(max_workers=2) as concurrent:
              a=concurrent.submit(race_google_state)
              b=concurrent.submit(race_google_state)
              assert sorted([a.result(timeout=15),b.result(timeout=15)])==[False,True]
          fake_token='SYNTHETIC_FAKE_REFRESH_POSTGRES_ONLY_NEVER_REAL_12345'
          with Session(engine) as db:
              seal_fake_cloud_grant(db,refresh_token=fake_token,now_epoch=1800000002)
              assert read_fake_cloud_grant(db)==fake_token
          with engine.connect() as db:
              ciphertext=db.execute(text('SELECT payload_cipher FROM drive_cloud_oauth_grants')).scalar_one()
              assert ciphertext.startswith('CFOC1:') and fake_token not in ciphertext
              claimed=db.execute(text('SELECT status,payload_cipher FROM drive_cloud_oauth_attempts')).one()
              assert claimed[0]=='claimed' and challenge.pkce_verifier not in str(claimed)
          print('POSTGRES_18_P1E_FAKE_CLOUD_OAUTH_ATOMIC_CUSTODY=PASS')

          # P1F: real disposable PostgreSQL18 enforces exact authenticated
          # browser-session binding; wrong browser must NOT consume the state.
          from hashlib import sha256 as p1f_sha256
          bound_attempt=begin_google_metadata_consent(private_google_configuration())
          bound_cookie_digest=p1f_sha256(b'SYNTHETIC_ONLY_BROWSER_COOKIE_NOT_REAL').hexdigest()
          other_cookie_digest=p1f_sha256(b'DIFFERENT_SYNTHETIC_BROWSER_COOKIE').hexdigest()
          with Session(engine) as scoped:
              remember_fake_cloud_attempt(
                  scoped,pending=bound_attempt,now_epoch=1800000010,
                  owner_session_digest=bound_cookie_digest)
          with Session(engine) as scoped:
              try:
                  claim_fake_cloud_attempt(
                      scoped,state=bound_attempt.state,now_epoch=1800000011,
                      owner_session_digest=other_cookie_digest)
                  raise AssertionError('Wrong browser consumed fake OAuth state')
              except CloudOAuthCustodyBlocked:
                  pass
          with Session(engine) as scoped:
              valid=claim_fake_cloud_attempt(
                  scoped,state=bound_attempt.state,now_epoch=1800000012,
                  owner_session_digest=bound_cookie_digest)
              assert valid.pkce_verifier==bound_attempt.pkce_verifier
          with Session(engine) as scoped:
              try:
                  claim_fake_cloud_attempt(
                      scoped,state=bound_attempt.state,now_epoch=1800000013,
                      owner_session_digest=bound_cookie_digest)
                  raise AssertionError('Replayed bound state was accepted')
              except CloudOAuthCustodyBlocked:
                  pass
          with engine.connect() as scoped:
              sealed=scoped.execute(text(
                  'SELECT payload_cipher FROM drive_cloud_oauth_attempts WHERE status=\'claimed\' '
                  'ORDER BY expires_epoch DESC LIMIT 1')).scalar_one()
              assert bound_cookie_digest not in sealed and bound_attempt.pkce_verifier not in sealed
          print('POSTGRES_18_P1F_SESSION_BOUND_OAUTH_REPLAY=PASS')

          # P1G: disposable PG18 multi-worker throttle proves that simultaneous
          # failures share one keyed owner lock and cannot bypass the limit.
          from app.owner_login_throttle import (
              issue_throttled_fake_owner_session, OwnerThrottleBlocked,
          )
          os.environ['P1F_SYNTHETIC_OWNER_GATEWAY_ONLY']='1'
          os.environ['P1G_FAKE_LOGIN_THROTTLE_ONLY']='1'
          os.environ['P1G_FAKE_THROTTLE_KEY']=base64.urlsafe_b64encode(b'T'*32).decode()
          p1g_barrier=Barrier(2)
          def p1g_bad_login_worker():
              p1g_barrier.wait(timeout=10)
              with Session(engine) as scoped:
                  try:
                      issue_throttled_fake_owner_session(
                          scoped,username='synthetic-owner',
                          password='synthetic-wrong-password',
                          totp_code='000000',now_epoch=1800001000)
                      return False
                  except OwnerThrottleBlocked:
                      return True
          with ThreadPoolExecutor(max_workers=2) as pool:
              a=pool.submit(p1g_bad_login_worker)
              b=pool.submit(p1g_bad_login_worker)
              assert a.result(timeout=20) and b.result(timeout=20)
          with engine.connect() as conn:
              row=conn.execute(text(
                  'SELECT owner_hmac,failures FROM owner_login_throttles'
              )).one()
              assert len(row[0])==64 and row[1]==2
          for t in range(3):
              with Session(engine) as scoped:
                  try:
                      issue_throttled_fake_owner_session(
                          scoped,username='synthetic-owner',
                          password='synthetic-wrong-password',
                          totp_code='000000',now_epoch=1800001001+t)
                      raise AssertionError('Rejected login bypassed throttle')
                  except OwnerThrottleBlocked:
                      pass
          with engine.connect() as conn:
              row=conn.execute(text(
                  'SELECT failures,locked_until_epoch FROM owner_login_throttles'
              )).one()
              assert row==(5,1800001003+900)
              assert conn.execute(text(
                  'SELECT COUNT(*) FROM owner_sessions'
              )).scalar_one()==0
          print('POSTGRES_18_P1G_DURABLE_OWNER_THROTTLE_RACE=PASS')

          # P1J: disposable PostgreSQL18 two-worker lease arbitration and
          # integrity-checked last-good receipt. No Google HTTP/real sources.
          from app.drive_scan_lease import (
              acquire_fake_scan_lease,finish_fake_scan_lease,fake_scan_lease_status,
          )
          from app.drive_private_sync import scan_private_synthetic_folder
          from app.drive_inbox_planner import DriveInboxBlocked
          os.environ['DRIVE_FAKE_TRANSPORT_ONLY']='1'
          os.environ['P1J_FAKE_SCAN_LEASE_ONLY']='1'
          p1j_folder='SYNTHETIC_P1J_PG_ONLY_FOLDER_2026'
          os.environ['DRIVE_ALLOWED_FOLDER_HMAC']=drive_index('folder',p1j_folder)
          lease_gate=Barrier(2)
          def acquire_once():
              lease_gate.wait(timeout=10)
              with Session(engine) as scoped:
                  try:
                      return acquire_fake_scan_lease(
                          scoped,folder_id=p1j_folder,now_epoch=1800010000)
                  except DriveInboxBlocked:
                      return None
          with ThreadPoolExecutor(max_workers=2) as pool:
              a=pool.submit(acquire_once)
              b=pool.submit(acquire_once)
              collected=[a.result(timeout=20),b.result(timeout=20)]
          assert len([x for x in collected if x is not None])==1
          lease=[x for x in collected if x is not None][0]
          def fictional_page(_):
              return {'files':[{
                  'id':'SYNTHETIC_P1J_PG_FILE_0000001',
                  'name':'fictional source.pdf','mimeType':'application/pdf',
                  'parents':[p1j_folder],'size':'42',
                  'modifiedTime':'2026-11-17T12:00:00+00:00'}]}
          with Session(engine) as scoped:
              scanned=scan_private_synthetic_folder(
                  scoped,folder_id=p1j_folder,get_page=fictional_page,
                  synthetic_authorization_approved=True)
              assert scanned['complete_folder_scan'] and scanned['scan_number']==1
          with Session(engine) as scoped:
              result=finish_fake_scan_lease(
                  scoped,folder_id=p1j_folder,lease_token=lease,
                  outcome='success',complete_receipt=scanned,now_epoch=1800010001)
              assert result['google_drive_connected'] is False
          with Session(engine) as scoped:
              s=fake_scan_lease_status(
                  scoped,folder_id=p1j_folder,now_epoch=1800010002)
              assert s['last_scan_number']==1 and s['heartbeat_is_real'] is False
          with Session(engine) as scoped:
              try:
                  finish_fake_scan_lease(
                      scoped,folder_id=p1j_folder,lease_token=lease,
                      outcome='success',complete_receipt=scanned,now_epoch=1800010003)
                  raise AssertionError('Replayed Drive scan lease accepted')
              except DriveInboxBlocked:
                  pass
          with engine.connect() as conn:
              saved=conn.execute(text(
                  'SELECT folder_hmac,last_source_hmac,last_receipt_hmac '
                  'FROM drive_scan_leases')).one()
              assert len(saved[0])==len(saved[1])==len(saved[2])==64
              assert p1j_folder not in str(saved) and lease not in str(saved)
          print('POSTGRES_18_P1J_SCAN_LEASE_LAST_GOOD=PASS')

          # P1M: disposable PostgreSQL18 real-compatible GRANT CUSTODY contract.
          # All keys, refresh strings, owner/folder/client IDs are invented;
          # no token exchange, Google account or live Railway database touched.
          import json
          from app.private_metadata_grant_custody import (
              store_private_metadata_grant,read_private_metadata_grant,
              rotate_private_metadata_grant,revoke_private_metadata_grant,
              PrivateMetadataCustodyBlocked,
          )
          os.environ['P1M_PRIVATE_METADATA_CUSTODY_ONLY']='1'
          os.environ['P1M_G2_REAL_CREDENTIAL_RELEASE_REVIEWED']='1'
          os.environ['P1M_METADATA_ENCRYPTION_KEYS_JSON']=json.dumps({
              'cfo-google-key-v1':base64.urlsafe_b64encode(b'A'*32).decode(),
              'cfo-google-key-v2':base64.urlsafe_b64encode(b'B'*32).decode(),
          })
          os.environ['P1M_METADATA_ACTIVE_KEY_ID']='cfo-google-key-v1'
          os.environ['P1M_METADATA_ROW_HMAC_KEY']=base64.urlsafe_b64encode(b'H'*32).decode()
          p1m_owner='SYNTHETIC_OWNER_CUSTODY_PG_2026'
          p1m_folder='SYNTHETIC_FOLDER_CUSTODY_PG_2026'
          p1m_client='000000000000-syntheticdev.apps.googleusercontent.com'
          p1m_refresh='SYNTHETIC_FAKE_REFRESH_'+'X'*72
          p1m_barrier=Barrier(2)
          def p1m_save():
              p1m_barrier.wait(timeout=10)
              with Session(engine) as scoped:
                  return store_private_metadata_grant(
                      scoped,owner_ref=p1m_owner,folder_id=p1m_folder,
                      client_id=p1m_client,refresh_token=p1m_refresh,
                      now_epoch=1800020000)
          with ThreadPoolExecutor(max_workers=2) as pool:
              f1=pool.submit(p1m_save)
              f2=pool.submit(p1m_save)
              revs=sorted([f1.result(timeout=20)['revision'],
                           f2.result(timeout=20)['revision']])
              assert revs==[1,2],revs
