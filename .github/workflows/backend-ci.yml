name: backend-ci
# Optimize expensive PostgreSQL integration checks: one exact-head PR run,
# cancel superseded PR heads, and permit explicit manual verification.
# No redundant main-branch push rerun after a tested squash merge.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_not_a_real_secret
          POSTGRES_DB: synthetic_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic_ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install synthetic-only Python application and PostgreSQL test driver
        run: python -m pip install -e '.[dev,postgres]'
      - name: Run synthetic-only regression tests
        run: pytest -q
      - name: Verify PostgreSQL 18 migrations without real financial records
        env:
          DATABASE_URL: postgresql+psycopg://postgres:synthetic_ci_not_a_real_secret@localhost:5432/synthetic_ci_db
          APP_DATA_MODE: synthetic
          # Public fake CI key; synthetic test data only.
          LEDGER_FIELD_KEYS_JSON: '{"synthetic_ci":"U1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1M="}'
          LEDGER_FIELD_ACTIVE_KEY: synthetic_ci
          PRIVATE_EVENT_HMAC_KEY: 'UFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFA='
          LEDGER_DEDUP_HMAC_KEY: 'REREREREREREREREREREREREREREREREREREREREREM='
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          import os
          engine=create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as c:
              assert c.execute(text('SELECT version_num FROM alembic_version')).scalar_one() == '0011_canonical_mirror'
              assert {'accounts','documents','transactions','audit_events','historical_filings'} <= set(inspect(c).get_table_names())
          # Test the operational encrypted bank-source path against real ephemeral PG18,
          # not just DDL. All identifiers and figures are fabricated.
          import base64
          os.environ['CONFIDENTIAL_BANK_HMAC_KEY']=base64.urlsafe_b64encode(b'C'*32).decode()
          os.environ['OWNER_PASSWORD']='synthetic-ci-owner-password-123456'
          from fastapi.testclient import TestClient
          from app.main import create_app
          app=create_app()
          assert app.title.startswith('Pakistan Tax')
          synthetic={
              'synthetic_fixture':True,'legal_owner':'individual','currency':'PKR',
              'account_ref':'SYNTHETIC-POSTGRES-ACCOUNT-1',
              'institution':'SYNTHETIC-BANK-ONLY',
              'source_ref':'SYNTHETIC-POSTGRES-STMT-0001',
              'period_start':'2024-07-01','period_end':'2024-07-31',
              'opening_balance_minor':12345,'closing_balance_minor':12545,
              'rows':[{'row_number':2,'posted_on':'2024-07-15','description':'synthetic only',
                       'reference':'SYN-PG1','credit_minor':200,'debit_minor':0,'balance_minor':12545}],
          }
          with TestClient(app) as client:
              client.auth=('owner',os.environ['OWNER_PASSWORD'])
              created=client.post('/api/finance/confidential-bank/statements',json=synthetic)
              assert created.status_code==201, created.text
              replay=client.post('/api/finance/confidential-bank/statements',json=synthetic)
              assert replay.status_code==200 and replay.json()['already_recorded']
              found=client.get('/api/finance/confidential-bank/statements',
                               params={'account_ref':synthetic['account_ref'],'tax_year':2025})
              assert found.status_code==200 and found.json()['source_count']==1
              assert client.get('/api/summary?tax_year=2025').json()['record_count']==0
          with engine.connect() as db:
              raw=db.execute(text('SELECT payload_json FROM confidential_bank_batches')).scalar_one()
              assert raw.startswith('TFLE1:')
              assert all(secret not in raw for secret in ('12345','12545','2024-07-15',
                                                         'SYNTHETIC-POSTGRES-ACCOUNT-1','synthetic only'))
          print('POSTGRES_18_SYNTHETIC_SCHEMA=PASS')
          print('POSTGRES_18_CONFIDENTIAL_BANK_OPERATIONAL=PASS')
          # G1-b: a separate empty schema, sealed PostgreSQL DATA backup,
          # injected transactional rollback and independent verified recovery.
          import tempfile,sys,subprocess
          import psycopg
          from pathlib import Path
          from app.pg_recovery import create_pg_snapshot,restore_pg_snapshot,PgRecoveryBlocked
          source_dsn=os.environ['DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')
          prefix=source_dsn.rsplit('/',1)[0]
          algebra_prefix=os.environ['DATABASE_URL'].rsplit('/',1)[0]
          os.environ['PG_SNAPSHOT_SOURCE_DSN']=source_dsn
          os.environ['PG_SNAPSHOT_KEY']=base64.urlsafe_b64encode(b'R'*32).decode()
          target_names=('synthetic_restore_rollback','synthetic_restore_verified')
          with psycopg.connect(source_dsn,autocommit=True) as admin:
              for name in target_names:
                  admin.execute('CREATE DATABASE ' + name)  # fixed fictional CI names
          for name in target_names:
              subprocess.run([sys.executable,'-m','alembic','-x',f'db_url={algebra_prefix}/{name}',
                              'upgrade','head'],check=True)
          with tempfile.TemporaryDirectory(prefix='synthetic-pg-backup-') as work:
              path=Path(work)/'sealed-postgres.tfpg'
              result=create_pg_snapshot(path)
              assert result['encrypted'] and result['verified_read_snapshot']
              assert path.stat().st_mode & 0o777 == 0o600
              assert b'SYNTHETIC-POSTGRES-ACCOUNT-1' not in path.read_bytes()
              os.environ['PG_SNAPSHOT_RESTORE_DSN']=prefix+'/synthetic_restore_rollback'
              try:
                  restore_pg_snapshot(path,inject_failure_after_tables=1)
                  raise AssertionError('Injected restore failure did not abort')
              except PgRecoveryBlocked as err:
                  assert 'Injected' in str(err)
              with psycopg.connect(os.environ['PG_SNAPSHOT_RESTORE_DSN']) as chk:
                  assert chk.execute('SELECT COUNT(*) FROM confidential_bank_batches').fetchone()[0]==0
              os.environ['PG_SNAPSHOT_KEY']=base64.urlsafe_b64encode(b'X'*32).decode()
              try:
                  restore_pg_snapshot(path)
                  raise AssertionError('Wrong backup key was accepted')
              except PgRecoveryBlocked as err:
                  assert 'authentication' in str(err)
              os.environ['PG_SNAPSHOT_KEY']=base64.urlsafe_b64encode(b'R'*32).decode()
              os.environ['PG_SNAPSHOT_RESTORE_DSN']=prefix+'/synthetic_restore_verified'
              recovered=restore_pg_snapshot(path)
              assert recovered['full_row_parity_verified'] and recovered['independent_target']
              with psycopg.connect(os.environ['PG_SNAPSHOT_RESTORE_DSN']) as chk:
                  assert chk.execute('SELECT COUNT(*) FROM confidential_bank_batches').fetchone()[0]==1
                  assert chk.execute('SELECT payload_json FROM confidential_bank_batches').fetchone()[0].startswith('TFLE1:')
              try:
                  restore_pg_snapshot(path)
                  raise AssertionError('Second restore improperly overwrote existing records')
              except PgRecoveryBlocked as err:
                  assert 'existing data' in str(err)
          print('POSTGRES_18_ENCRYPTED_DATA_RESTORE_PARITY=PASS')
          # G1-c source census: the existing PostgreSQL instance, same CI job.
          # Exercise real PG snapshot isolation, strict schema, redacted HMAC parity,
          # review-state retention and no writes; no extra database service/job.
          from sqlalchemy.orm import Session
          from datetime import date
          from app.models import Account,Document,Transaction
          with Session(engine) as db:
              db.add(Account(id='00000000-0000-4000-8000-000000000051',
                             name='Fictional Account',institution='Fictional Bank',
                             currency='PKR',legal_owner='individual'))
              db.add(Document(id='00000000-0000-4000-8000-000000000052',
                              account_id='00000000-0000-4000-8000-000000000051',
                              sha256='f'*64,digest_scheme='hmac_sha256_v1',
                              file_format='csv',parser_version='synthetic-ci',
                              period_start=date(2024,7,1),period_end=date(2024,7,31),
                              coverage_declared=True))
              db.add(Transaction(id='00000000-0000-4000-8000-000000000053',
                                 account_id='00000000-0000-4000-8000-000000000051',
                                 document_id='00000000-0000-4000-8000-000000000052',
                                 row_number=1,fingerprint='a'*64,
                                 posted_on=date(2024,7,15),description='Fictional receipt',
                                 credit_minor=23500,debit_minor=0,balance_minor=23500,
                                 category='unreviewed',reviewed=False,
                                 overlap_possible=False,excluded=False,overlap_resolved=False))
              db.commit()
          from app.g1c_preflight import preflight_postgres_source
          os.environ['PG_G1C_SOURCE_DSN']=source_dsn
          audit=preflight_postgres_source()
          assert audit['read_only'] and audit['source_graph_consistent'], audit['blocking_issues']
          assert audit['source_tables']==20 and audit['source_rows']>=4
          assert audit['review_needed_transactions']==1
          assert len(audit['source_integrity_hmac'])==64 and len(audit['year_owner_account_direction_hmac'])==64
          assert not audit['migration_performed'] and not audit['cutover_authorized']
          assert 'Fictional receipt' not in str(audit) and '23500' not in str(audit)
          with engine.connect() as verify:
              assert verify.execute(text('SELECT credit_minor FROM transactions WHERE row_number=1')).scalar_one()==23500
          print('POSTGRES_18_G1C_READ_ONLY_CENSUS=PASS')
          # G1-c candidate is built ONLY on a separately migrated and
          # independently full-row-restored synthetic database, never source.
          from app.g1c_candidate import create_verified_sealed_candidate,G1CCandidateBlocked
          target_names=('synthetic_restore_candidate','synthetic_restore_fail_candidate')
          with psycopg.connect(source_dsn,autocommit=True) as admin:
              for name in target_names:
                  admin.execute('CREATE DATABASE ' + name)
          for name in target_names:
              subprocess.run([sys.executable,'-m','alembic','-x',f'db_url={algebra_prefix}/{name}',
                              'upgrade','head'],check=True)
          os.environ['PG_SNAPSHOT_RESTORE_DSN']=prefix+'/synthetic_restore_fail_candidate'
          with tempfile.TemporaryDirectory(prefix='synthetic-g1c-candidate-') as work:
              sealed=Path(work)/'backup-failure.tfpg'
              try:
                  create_verified_sealed_candidate(sealed,inject_failure_after_rows=1)
                  raise AssertionError('Injected G1c candidate failure did not abort')
              except G1CCandidateBlocked as exc:
                  assert 'Injected' in str(exc)
              with psycopg.connect(os.environ['PG_SNAPSHOT_RESTORE_DSN']) as chk:
                  assert chk.execute('SELECT COUNT(*) FROM canonical_source_mirrors').fetchone()[0]==0
                  assert chk.execute('SELECT COUNT(*) FROM transactions').fetchone()[0]==1
              os.environ['PG_SNAPSHOT_RESTORE_DSN']=prefix+'/synthetic_restore_candidate'
              result=create_verified_sealed_candidate(Path(work)/'backup-valid.tfpg')
              assert result['independent_restore_verified'] and result['full_source_row_parity_verified']
              assert result['original_database_untouched'] and not result['active_ledger_cutover']
              assert result['legacy_plaintext_still_present'] and not result['complete_g1']
              with psycopg.connect(os.environ['PG_SNAPSHOT_RESTORE_DSN']) as chk:
                  source_rows=sum(x[0] for x in chk.execute(
                      'SELECT COUNT(*) FROM accounts UNION ALL SELECT COUNT(*) FROM documents '
                      'UNION ALL SELECT COUNT(*) FROM transactions').fetchall())
                  count=chk.execute('SELECT COUNT(*) FROM canonical_source_mirrors').fetchone()[0]
                  assert count>=source_rows and count==result['sealed_source_rows']
                  records=chk.execute('SELECT payload_json FROM canonical_source_mirrors').fetchall()
                  assert all(x[0].startswith('TFLE1:') for x in records)
                  assert all('23500' not in x[0] and 'Fictional Account' not in x[0] for x in records)
              with psycopg.connect(source_dsn) as chk:
                  assert chk.execute('SELECT COUNT(*) FROM canonical_source_mirrors').fetchone()[0]==0
          print('POSTGRES_18_G1C_ENCRYPTED_RESTORED_CANDIDATE=PASS')
          # A5a read-only candidate inspection uses ONLY sealed payload table.
          # Compare independent original-source census and exact row/account/year parity.
          from app.g1c_projection import inspect_restored_sealed_candidate
          verified=inspect_restored_sealed_candidate()
          assert verified['read_only'] and verified['full_source_row_parity_verified']
          assert verified['authenticated_mirror_count']==result['sealed_source_rows']
          assert not verified['active_ledger_cutover'] and not verified['canonical_operational_store_ready']
          assert verified['legacy_plaintext_still_present'] and verified['tax_due_minor'] is None
          print('POSTGRES_18_G1C_SEALED_READ_SIDE_PARITY=PASS')

          PY
