# REVIEW CANDIDATE ONLY. Not read by Docker/Railway runtime.
# Runtime rate limits still REQUIRE an independently accepted http{} zone and
# abuse controls; this server-only candidate intentionally does NOT claim them.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; manifest-src 'self'; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # The sole public synthetic API route. The complete financial API,
    # uploaded documents and PostgreSQL are NEVER publicly proxied.
    location = /api/preview/status {
        limit_except GET { deny all; }
        proxy_http_version 1.1;
        # Railway reassigns private service IPs after each deployment.
        # A literal proxy_pass hostname is resolved ONCE at Nginx startup and
        # can strand the public preview on a dead backend address (502/504).
        # Runtime variable lookup with the project-scoped Railway DNS server
        # refreshes the address; do not route this through a public domain.
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_preview_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_preview_upstream/internal/preview/status$is_args$args;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Personal-CFO-Preview-Key "${PREVIEW_INTERNAL_TOKEN}";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 7s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    # P1O EXACT-ROUTE REVIEW CANDIDATE; never activate without G2 signoff.
    location = /api/owner/login {
        # No access log for URL-target, state or Google authorization code.
        access_log off;
        # Nginx errors may otherwise quote the original callback request target.
        # Actual Railway edge/upstream platform logs STILL need independent audit.
        error_log /dev/null crit;
        if ($host != "personal-cfo-frontend-preview-development.up.railway.app") { return 403; }
        if ($request_method != "POST") { return 405; }
        proxy_http_version 1.1;
        resolver [fd12::10] valid=5s ipv6=off;
        resolver_timeout 2s;
        set $private_oauth_upstream "personal-cfo-api-preview.railway.internal:8000";
        proxy_pass http://$private_oauth_upstream/internal/drive/auth/login;
        proxy_set_header Host personal-cfo-api-preview.railway.internal;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Personal-CFO-Preview-Key "";
        # Operator-secret substitution is NOT configured in the live Dockerfile.
        # It must be separately G2-approved alongside actual secure key custody.
        # This directive REPLACES, never forwards, any browser-supplied header.
        proxy_set_header X-Personal-CFO-Private-Gateway "${P1Q_PRIVATE_GATEWAY_SHARED_TOKEN}";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

