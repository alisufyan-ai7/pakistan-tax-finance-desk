[project]
name = "pakistan-tax-finance-desk"
version = "0.1.0"
description = "Private Pakistani financial ledger MVP; not a certified tax calculator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.9,<1",
  "openpyxl>=3.1,<4",
  "cryptography>=43,<47",
  "alembic>=1.14,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Alembic migrations is an operational directory, not a distributable Python
# package. Explicit discovery avoids shipping it as a namespace package.
[tool.setuptools]
packages = ["app"]
